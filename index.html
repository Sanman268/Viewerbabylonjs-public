<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Suspension Viewer — Babylon.js</title>
    <!--
      Critical inline CSS to prevent a flash of unstyled content (FOUC) on
      reload, before the bundled stylesheet loads. Keeps the page dark and the
      canvas full-viewport, and shows a centered fallback while booting.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #14171c;
        color: #e6e8eb;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      #renderCanvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
        touch-action: none;
      }

      body.app-booting > #app {
        visibility: hidden;
      }

      body.app-booting::before {
        content: "Loading 3D viewer…";
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        color: #9aa3ad;
      }
    </style>
  </head>
  <body class="app-booting">
    <div id="app">
      <!-- WebGL render target -->
      <canvas id="renderCanvas" touch-action="none"></canvas>

      <!-- Loading / error overlay (shown until the model is ready) -->
      <div id="loadingOverlay" class="overlay" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loadingText" class="overlay__text">Loading model…</p>
      </div>

      <!-- Top toolbar -->
      <header class="toolbar">
        <h1 class="toolbar__title">Double-Axle Suspension</h1>
        <div class="toolbar__actions">
          <div class="search-wrap">
            <input
              id="searchInput"
              class="search"
              type="search"
              placeholder="Search parts…"
              autocomplete="off"
              role="combobox"
              aria-expanded="false"
              aria-autocomplete="list"
              aria-controls="searchResults"
              aria-label="Search parts by name"
            />
            <ul id="searchResults" class="search-results" role="listbox" hidden></ul>
          </div>
          <button
            id="statsBtn"
            class="btn"
            type="button"
            aria-pressed="false"
            title="Toggle performance stats"
          >
            Stats
          </button>
          <button id="resetBtn" class="btn" type="button" title="Reset view (R)">
            Reset view
          </button>
        </div>
      </header>

      <!-- Selection info panel -->
      <aside id="infoPanel" class="panel panel--empty" aria-live="polite">
        <div class="panel__placeholder">
          <p class="panel__hint">Click a part to inspect it.</p>
          <p class="panel__sub">Drag to rotate · scroll / pinch to zoom</p>
        </div>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
